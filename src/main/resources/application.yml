spring:
  application:
    name: d14

  profiles:
    # 로컬 개발 기본값. 그룹 설정으로 dev의 공통 인프라 설정(datasource/redis/ai 등)도 함께 로드된다.
    # EC2 배포 환경은 docker-compose 가 SPRING_PROFILES_ACTIVE=dev 로 덮어써 local 마커가 빠지므로 JSON 로깅으로 동작한다.
    active: local
    group:
      local: dev

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  # graceful shutdown이 in-flight 요청을 마무리할 최대 대기 시간. 초과 시 강제 종료.
  # 질문 음성 스트림 등 오래 걸리는 요청도 여유 있게 마무리하도록 60초로 잡는다.
  # 단, docker stop 의 SIGKILL 타임아웃(compose 의 stop_grace_period)이 이 값보다 커야
  # 컨테이너가 강제로 죽기 전에 graceful 종료가 끝난다.
  lifecycle:
    timeout-per-shutdown-phase: 60s

server:
  port: 8080
  # 블루-그린 전환 시 구 버전(active) 컨테이너를 내릴 때, 처리 중인 요청을 유실하지 않고
  # 마무리한 뒤 종료한다. timeout-per-shutdown-phase 안에 끝나지 않으면 강제 종료된다.
  shutdown: graceful

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 서버 상태 지표(D 지표)를 Prometheus가 긁어갈 엔드포인트.
# 포트를 8080과 분리하는 이유: Caddy가 호스트의 모든 경로를 8080으로 프록시하므로,
# 8080에 두면 https://hilit.my/actuator/prometheus 가 외부에 열린다.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}
