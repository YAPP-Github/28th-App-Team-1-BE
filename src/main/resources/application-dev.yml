spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:d14}?sslmode=disable
    username: ${POSTGRES_USER:d14}
    password: ${POSTGRES_PASSWORD:d14}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql(System.out 직접 출력)은 JSON 인코더를 안 거쳐 traceId도 안 실리고 CloudWatch에서 구조화되지 않는다.
    # SQL은 아래 logging.level.org.hibernate.SQL 로거로 남겨 JSON 한 줄 + traceId로 조회한다.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 여러 줄 pretty-print는 CloudWatch에서 이벤트가 쪼개져 보기 불편하므로 한 줄로 출력한다.
        format_sql: false
        default_batch_fetch_size: 100

  ai:
    retry:
      # Spring AI 자체 재시도(기본 최대 10회·최대 3분 백오프)를 끄고, 서비스 레이어의 커스텀 재시도로 일원화한다.
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          temperature: 0.3
          max-tokens: 1000
      embedding:
        options:
          model: text-embedding-3-small
      audio:
        speech:
          options:
            voice: ${OPENAI_TTS_VOICE:alloy}
        transcription:
          options:
            model: whisper-1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
          max-tokens: 8192
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:10800000}
  refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

demo:
  enabled: ${DEMO_LOGIN_ENABLED:true}
  credential: ${DEMO_LOGIN_CREDENTIAL}
  user-id: ${DEMO_LOGIN_USER_ID}

encryption:
  token-key: ${TOKEN_ENCRYPTION_KEY}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.yapp.d14: DEBUG
    # SQL 문장과 바인딩 파라미터 값. SLF4J → logback JSON 인코더를 거쳐 한 줄씩, traceId와 함께 남는다.
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
