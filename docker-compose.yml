# 로컬 개발 인프라(Postgres+pgvector, Redis).
# 앱은 이 컴포즈로 띄우지 않는다 — `./gradlew bootRun` 으로 로컬 실행하고, DB/Redis만 여기서 기동한다.
#   docker compose up -d postgres redis
# 프로덕션 배포는 k3s + ArgoCD(GitOps) 가 담당한다(이 파일과 무관). Hilit-GitOps 레포 참고.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: d14-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - d14-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: d14-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - d14-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  d14-net:
    driver: bridge
