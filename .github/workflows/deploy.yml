name: Deploy

# 릴리즈 태그(vX.Y.Z) 발행 시에만 빌드·배포한다.
# - push(tags): release-please(PAT) 가 만든 태그, 또는 사람이 직접 민 태그
#   (수동 릴리즈·롤백 re-tag)로 배포
# - workflow_dispatch: 수동 실행
# 단위 테스트 게이트는 ci.yml 이 PR/main push 에서 담당한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build Docker image & Push to ECR
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env file on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p /opt/d14
            cat > /opt/d14/.env << ENVEOF
            ECR_REPOSITORY_URL=${{ secrets.ECR_REPOSITORY_URL }}
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ACCESS_TOKEN_EXPIRY_MS=${{ secrets.JWT_ACCESS_TOKEN_EXPIRY_MS }}
            JWT_REFRESH_TOKEN_EXPIRY_MS=${{ secrets.JWT_REFRESH_TOKEN_EXPIRY_MS }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
            KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}
            DEMO_LOGIN_CREDENTIAL=${{ secrets.DEMO_LOGIN_CREDENTIAL }}
            DEMO_LOGIN_USER_ID=${{ secrets.DEMO_LOGIN_USER_ID }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
            ENVEOF
            chmod 600 /opt/d14/.env

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml,Caddyfile.template,scripts/deploy.sh"
          target: "/opt/d14/"

      - name: Blue-green deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          # 실제 블루-그린 전환(신 버전 기동 → /health 대기 → caddy reload → 구 버전 graceful 종료)은
          # 리포지토리의 scripts/deploy.sh 가 담당한다. 여기서는 그 스크립트를 실행만 한다.
          script: |
            set -euo pipefail
            bash /opt/d14/scripts/deploy.sh

  # ──────────────────────────────────────────────────────────────
  # Job 3: Notify Discord
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Determine result
        id: result
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "failure" ]]; then
            echo "stage=Build/Push" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "stage=Deploy" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build-and-push.result }}" == "cancelled" \
               || "${{ needs.deploy.result }}" == "cancelled" ]]; then
            echo "stage=-" >> "$GITHUB_OUTPUT"
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "stage=Deploy" >> "$GITHUB_OUTPUT"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ steps.result.outputs.status }}
          STAGE: ${{ steps.result.outputs.stage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          [ -z "$FIRST_LINE" ] && FIRST_LINE="(수동 실행)"

          case "$STATUS" in
            success)   COLOR=3066993; TITLE_PREFIX="배포 성공" ;;
            cancelled) COLOR=9807270; TITLE_PREFIX="배포 취소" ;;
            *)         COLOR=15158332; TITLE_PREFIX="배포 실패 (${STAGE})" ;;
          esac

          PAYLOAD=$(jq -n \
            --arg title "${TITLE_PREFIX}: ${FIRST_LINE}" \
            --arg url "$RUN_URL" \
            --arg author "$ACTOR" \
            --arg author_url "https://github.com/$ACTOR" \
            --arg avatar "https://github.com/$ACTOR.png" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg footer "Run #$RUN_NUMBER" \
            --argjson color $COLOR \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                author: { name: $author, url: $author_url, icon_url: $avatar },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true }
                ],
                footer: { text: $footer }
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
