name: Deploy

# 릴리즈 태그(vX.Y.Z) 발행 시에만 빌드·배포한다.
# - push(tags): release-please(PAT) 가 만든 태그, 또는 사람이 직접 민 태그
#   (수동 릴리즈·롤백 re-tag)로 배포
# - workflow_dispatch: 수동 실행(태그 아닌 브랜치에서 실행 시 short_sha 로 빌드만)
# 단위 테스트 게이트는 ci.yml 이 PR/main push 에서 담당한다.
#
# 배포 방식은 GitOps(ArgoCD) 다:
#   1) 이미지를 ECR 에 push
#   2) Hilit-GitOps 레포의 charts/backend/values-prod.yaml image.tag 를 이 태그로 커밋(write-back)
#   3) ArgoCD 가 GitOps 레포 변경을 감지해 k3s prod 네임스페이스로 롤링 배포(자동 sync)
# EC2 SSH·docker-compose·블루그린은 더 이상 쓰지 않는다. 환경변수(시크릿)는 GitOps 레포의
# SealedSecret(secrets/prod/backend-secret.yaml)이 담당하므로 이 워크플로우는 시크릿을 주입하지 않는다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build Docker image & Push to ECR
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        # 릴리즈 태그 push 면 그 버전(vX.Y.Z)을, 수동(workflow_dispatch)이면 short_sha 를 태그로 쓴다.
        # 이 값이 그대로 ECR 태그이자 GitOps values-prod.yaml image.tag 가 된다(불변·추적 가능).
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 2: Bump image tag in GitOps repo (ArgoCD write-back)
  # ──────────────────────────────────────────────────────────────
  # 릴리즈 태그 push 일 때만 prod 를 갱신한다. 수동 dispatch(브랜치)는 빌드/푸시까지만.
  bump-gitops:
    name: Bump prod image tag in GitOps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: Team-Hilit/Hilit-GitOps
          # Hilit-GitOps 에 contents:write 권한이 있는 fine-grained PAT.
          # bootstrap 용 read-only PAT 로는 push 못 한다 — 별도 시크릿을 등록해야 한다.
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Update backend prod image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          yq -i '.image.tag = strenv(IMAGE_TAG)' charts/backend/values-prod.yaml

      - name: Commit & push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "hilit-ci[bot]"
          git config user.email "hilit-ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "이미 ${IMAGE_TAG} 로 반영돼 있음 — 커밋 생략"
            exit 0
          fi
          git add charts/backend/values-prod.yaml
          git commit -m "chore: bump backend(prod) image to ${IMAGE_TAG}"
          git push origin main

  # ──────────────────────────────────────────────────────────────
  # Job 3: Notify Discord
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build-and-push, bump-gitops]
    if: always()

    steps:
      - name: Determine result
        id: result
        # bump-gitops 는 태그 push 가 아니면 skip 되므로(그땐 build 만) 실패로 취급하지 않는다.
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "failure" ]]; then
            echo "stage=Build/Push" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.bump-gitops.result }}" == "failure" ]]; then
            echo "stage=GitOps write-back" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build-and-push.result }}" == "cancelled" \
               || "${{ needs.bump-gitops.result }}" == "cancelled" ]]; then
            echo "stage=-" >> "$GITHUB_OUTPUT"
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "stage=GitOps" >> "$GITHUB_OUTPUT"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ steps.result.outputs.status }}
          STAGE: ${{ steps.result.outputs.stage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          [ -z "$FIRST_LINE" ] && FIRST_LINE="(수동 실행)"

          case "$STATUS" in
            success)   COLOR=3066993; TITLE_PREFIX="배포 성공" ;;
            cancelled) COLOR=9807270; TITLE_PREFIX="배포 취소" ;;
            *)         COLOR=15158332; TITLE_PREFIX="배포 실패 (${STAGE})" ;;
          esac

          PAYLOAD=$(jq -n \
            --arg title "${TITLE_PREFIX}: ${FIRST_LINE}" \
            --arg url "$RUN_URL" \
            --arg author "$ACTOR" \
            --arg author_url "https://github.com/$ACTOR" \
            --arg avatar "https://github.com/$ACTOR.png" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg footer "Run #$RUN_NUMBER" \
            --argjson color $COLOR \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                author: { name: $author, url: $author_url, icon_url: $avatar },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true }
                ],
                footer: { text: $footer }
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
