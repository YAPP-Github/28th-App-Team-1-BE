name: CI

# 테스트 게이트: PR(→main)과 main push 에서 단위 테스트를 실행해
# 깨진 코드가 main 에 유입되는 것을 차단한다.
# 실제 빌드/배포는 deploy.yml 이 릴리즈 태그(v*) 발행 시에만 수행한다.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
